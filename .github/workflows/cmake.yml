name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    env:
      CSOUND_INSTALL_PREFIX: ${{ github.workspace }}/.cache/csound-install
      CSOUND_CACHE_VERSION: csound7-v2

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os_name: macos
            runner: macos-latest
            build_dir: build-macos
            archive_name: csound-ac-macos.zip

          - name: Linux
            os_name: linux
            runner: ubuntu-latest
            build_dir: build-linux
            archive_name: csound-ac-linux.zip

          - name: Windows
            os_name: windows
            runner: windows-latest
            build_dir: build-windows
            archive_name: csound-ac-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies - macOS
        if: matrix.os_name == 'macos'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            swig \
            boost \
            eigen \
            libsndfile \
            portaudio \
            bison \
            flex \
            doxygen \
            graphviz \
            python@3.12 \
            ccache \
            zip
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies - Linux
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            swig \
            python3 \
            python3-dev \
            python3-pip \
            libboost-all-dev \
            libeigen3-dev \
            libsndfile1-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpulse-dev \
            portaudio19-dev \
            libportaudio2 \
            liblo-dev \
            libffi-dev \
            libcurl4-openssl-dev \
            bison \
            flex \
            doxygen \
            graphviz \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            latexmk \
            ccache \
            zip \
            p7zip-full

      - name: Install dependencies - Windows
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          choco install -y `
            cmake `
            ninja `
            swig `
            python `
            curl `
            doxygen.install `
            graphviz `
            winflexbison3 `
            ccache `
            7zip
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-boost mingw-w64-x86_64-pkgconf mingw-w64-x86_64-libsndfile
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            ~/Library/Caches/ccache
            C:\Users\runneradmin\AppData\Local\ccache
          key: ${{ runner.os }}-ccache-${{ github.repository }}-${{ github.ref_name }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.hpp', '**/*.cpp', '**/*.h') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.repository }}-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-${{ github.repository }}-
            ${{ runner.os }}-ccache-

      - name: Restore Csound install cache
        id: cache-csound
        uses: actions/cache/restore@v4
        with:
          path: .cache/csound-install
          key: ${{ runner.os }}-${{ env.CSOUND_CACHE_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ env.CSOUND_CACHE_VERSION }}-

      - name: Validate cached Csound install
        id: validate-csound-cache
        shell: pwsh
        run: |
          $prefix = $env:CSOUND_INSTALL_PREFIX
          $bin = Join-Path $prefix "bin"
          $exe = if ($IsWindows) { Join-Path $bin "csound.exe" } else { Join-Path $bin "csound" }
          $ok = Test-Path $exe

          if ($IsWindows) {
              $ok = $ok -and (Test-Path (Join-Path $bin "csound64.dll"))
          } elseif ($IsMacOS) {
              $frameworks = @(
                  (Join-Path $prefix "Library/Frameworks/CsoundLib64.framework/CsoundLib64"),
                  (Join-Path $HOME "Library/Frameworks/CsoundLib64.framework/CsoundLib64"),
                  "/Library/Frameworks/CsoundLib64.framework/CsoundLib64"
              )
              $libs = @(
                  (Join-Path $prefix "lib/libcsound64.dylib"),
                  (Join-Path $prefix "lib64/libcsound64.dylib")
              )
              $ok = $ok -and (($frameworks + $libs | Where-Object { Test-Path $_ }).Count -gt 0)
          } else {
              $libs = @(
                  (Join-Path $prefix "lib/libcsound64.so"),
                  (Join-Path $prefix "lib64/libcsound64.so")
              )
              $ok = $ok -and (($libs | Where-Object { Test-Path $_ }).Count -gt 0)
          }

          if ($ok) {
              "valid=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "Using cached Csound install at $prefix"
              & $exe --version
          } else {
              Write-Host "Cached Csound install is missing or incomplete; deleting $prefix so it will be rebuilt."
              Remove-Item -Recurse -Force $prefix -ErrorAction SilentlyContinue
              "valid=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Add Csound install to environment
        shell: pwsh
        run: |
          $prefix = $env:CSOUND_INSTALL_PREFIX
          $bin = Join-Path $prefix "bin"
          $lib = Join-Path $prefix "lib"
          $lib64 = Join-Path $prefix "lib64"
          $frameworks = Join-Path $prefix "Library/Frameworks"
          $home_frameworks = Join-Path $HOME "Library/Frameworks"

          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $lib | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $lib64 | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          if ($IsLinux) {
              "LD_LIBRARY_PATH=$lib`:$lib64`:$env:LD_LIBRARY_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($IsMacOS) {
              "DYLD_LIBRARY_PATH=$lib`:$lib64`:$env:DYLD_LIBRARY_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "CMAKE_FRAMEWORK_PATH=$frameworks`:$home_frameworks`:$env:CMAKE_FRAMEWORK_PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Install Csound 7 from GitHub - Linux
        if: matrix.os_name == 'linux' && steps.validate-csound-cache.outputs.valid != 'true'
        run: |
          git clone --depth 1 https://github.com/csound/csound.git
          cmake -S csound -B csound/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_JAVA_INTERFACE=OFF \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DINSTALL_PYTHON_INTERFACE=OFF \
            -DBUILD_PYTHON_OPCODES=OFF \
            -DUSE_PYTHON=OFF \
            -DCMAKE_INSTALL_PREFIX="$CSOUND_INSTALL_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build csound/build --parallel
          cmake --install csound/build
          echo "$CSOUND_INSTALL_PREFIX/lib" | sudo tee /etc/ld.so.conf.d/csound.conf
          echo "$CSOUND_INSTALL_PREFIX/lib64" | sudo tee -a /etc/ld.so.conf.d/csound.conf
          sudo ldconfig

      - name: Install Csound 7 from GitHub - macOS
        if: matrix.os_name == 'macos' && steps.validate-csound-cache.outputs.valid != 'true'
        run: |
          git clone --depth 1 https://github.com/csound/csound.git
          BISON_EXECUTABLE="$(brew --prefix bison)/bin/bison"
          FLEX_EXECUTABLE="$(brew --prefix flex)/bin/flex"
          cmake -S csound -B csound/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBISON_EXECUTABLE="$BISON_EXECUTABLE" \
            -DFLEX_EXECUTABLE="$FLEX_EXECUTABLE" \
            -DBUILD_TESTS=OFF \
            -DBUILD_JAVA_INTERFACE=OFF \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DCMAKE_INSTALL_PREFIX="$CSOUND_INSTALL_PREFIX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build csound/build --parallel
          cmake --install csound/build

      - name: Install Csound 7 from GitHub - Windows
        if: matrix.os_name == 'windows' && steps.validate-csound-cache.outputs.valid != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/csound/csound.git
          cd csound
          .\vcpkg\bootstrap-vcpkg.bat
          cmake -B build -S . `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_JAVA_INTERFACE=OFF" `
            "-DBUILD_PYTHON_INTERFACE=OFF" `
            "-DUSE_VCPKG=1" `
            "-DCUSTOM_CMAKE=./platform/windows/Custom-vs.cmake" `
            "-DCMAKE_C_COMPILER_LAUNCHER=ccache" `
            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          cmake --build build --config Release
          cmake --install build --prefix "$env:CSOUND_INSTALL_PREFIX" --config Release

      - name: Save repaired Csound install cache
        if: steps.validate-csound-cache.outputs.valid != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/csound-install
          key: ${{ runner.os }}-${{ env.CSOUND_CACHE_VERSION }}-${{ github.run_id }}

      - name: Import macOS signing certificate
        if: matrix.os_name == 'macos'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}

      - name: Decode App Store Connect API key
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Configure - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist/csound-ac" \
            -DGENERATE_DOCUMENTATION=OFF \
            -DCMAKE_PREFIX_PATH="$CSOUND_INSTALL_PREFIX;$HOME/Library/Frameworks;/Library/Frameworks;/opt/homebrew;/usr/local;/usr" \
            -DCSOUND_ROOT_HINT="$CSOUND_INSTALL_PREFIX" \
            -DCSOUND_EXECUTABLE="$CSOUND_INSTALL_PREFIX/bin/csound" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DGENERATE_DOCUMENTATION=OFF \
            -DCSOUND_AC_INSTALL_PYTHON_TO_SITEARCH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCSOUND_AC_ENABLE_CODESIGN=ON \
            -DCSOUND_AC_ENABLE_NOTARIZATION=ON \
            -DAPPLE_CODESIGN_IDENTITY="${{ secrets.APPLE_CODESIGN_IDENTITY }}" \
            -DAPPLE_NOTARY_KEY="$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
            -DAPPLE_NOTARY_KEY_ID="${{ secrets.APPLE_API_KEY_ID }}" \
            -DAPPLE_NOTARY_ISSUER_ID="${{ secrets.APPLE_API_ISSUER_ID }}"

      - name: Configure - Linux
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
           cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist/csound-ac" \
            -DGENERATE_DOCUMENTATION=OFF \
            -DCMAKE_PREFIX_PATH="$CSOUND_INSTALL_PREFIX;/usr/local;/usr" \
            -DCSOUND_ROOT_HINT="$CSOUND_INSTALL_PREFIX" \
            -DPython3_EXECUTABLE="$(python -c 'import sys; print(sys.executable)')" \
            -DCSOUND_AC_INSTALL_PYTHON_TO_SITEARCH=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Configure - Windows
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "$env:CSOUND_INSTALL_PREFIX" `
            -Include "*.dll","*.dll.a","*.lib" |
            Select-Object FullName
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja `
            "-DCMAKE_BUILD_TYPE=RelWithDebInfo" `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\dist\csound-ac" `
            "-DGENERATE_DOCUMENTATION=OFF" `
            "-DCMAKE_PREFIX_PATH=$env:CSOUND_INSTALL_PREFIX;C:\msys64\mingw64" `
            "-DCSOUND_EXECUTABLE=$env:CSOUND_INSTALL_PREFIX/bin/csound.exe" `
            "-DCSOUND_LIBRARY=$env:CSOUND_INSTALL_PREFIX/lib64/libcsound64.lib" `
            "-DCSOUND_LIBRARIES=$env:CSOUND_INSTALL_PREFIX/lib64/libcsound64.lib" `
            "-DCSOUND_ROOT_HINT=$env:CSOUND_INSTALL_PREFIX" `
            "-DPython3_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')" `
            "-DCSOUND_AC_INSTALL_PYTHON_TO_SITEARCH=OFF" `
            "-DCMAKE_C_COMPILER_LAUNCHER=ccache" `
            "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --config Release --verbose

      - name: Stage dist
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target stage_dist --config Release --verbose

      - name: Sign dist - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target sign_dist --config Release --verbose

      - name: Package dist
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target package_dist --config Release --verbose

      - name: Notarize dist - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target notarize_dist --config Release --verbose

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.build_dir }}/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip
