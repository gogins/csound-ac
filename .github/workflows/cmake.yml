name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os_name: macos
            runner: macos-latest
            build_dir: build-macos
            archive_name: csound-ac-macos.zip

          - name: Linux
            os_name: linux
            runner: ubuntu-latest
            build_dir: build-linux
            archive_name: csound-ac-linux.zip

          - name: Windows
            os_name: windows
            runner: windows-latest
            build_dir: build-windows
            archive_name: csound-ac-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies - macOS
        if: matrix.os_name == 'macos'
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            swig \
            boost \
            eigen \
            libsndfile \
            portaudio \
            bison \
            flex \
            doxygen \
            graphviz \
            python@3.12 \
            zip
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies - Linux
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            swig \
            python3 \
            python3-dev \
            python3-pip \
            libboost-all-dev \
            libeigen3-dev \
            libsndfile1-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            libpulse-dev \
            portaudio19-dev \
            libportaudio2 \
            liblo-dev \
            libffi-dev \
            libcurl4-openssl-dev \
            bison \
            flex \
            doxygen \
            graphviz \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-science \
            latexmk \
            zip \
            p7zip-full

      - name: Install dependencies - Windows
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          choco install -y `
            cmake `
            ninja `
            swig `
            python `
            curl `
            doxygen.install `
            graphviz `
            winflexbison3 `
            7zip
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Csound 7 from GitHub - Linux
        if: matrix.os_name == 'linux'
        run: |
          git clone --depth 1 https://github.com/csound/csound.git
          cmake -S csound -B csound/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DBUILD_JAVA_INTERFACE=OFF \
            -DBUILD_PYTHON_INTERFACE=OFF
          cmake --build csound/build --parallel
          sudo cmake --install csound/build
          echo "/usr/local/lib" | sudo tee /etc/ld.so.conf.d/csound.conf
          sudo ldconfig

      - name: Install Csound 7 from GitHub - macOS
        if: matrix.os_name == 'macos'
        run: |
          git clone --depth 1 https://github.com/csound/csound.git
          BISON_EXECUTABLE="$(brew --prefix bison)/bin/bison"
          FLEX_EXECUTABLE="$(brew --prefix flex)/bin/flex"
          cmake -S csound -B csound/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBISON_EXECUTABLE="$BISON_EXECUTABLE" \
            -DFLEX_EXECUTABLE="$FLEX_EXECUTABLE" \
            -DBUILD_TESTS=OFF \
            -DBUILD_JAVA_INTERFACE=OFF \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build csound/build --parallel
          sudo cmake --install csound/build

      - name: Install Csound 7 from GitHub - Windows
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/csound/csound.git
          cd csound
          .\vcpkg\bootstrap-vcpkg.bat
          cmake -B build -S . `
            -DBUILD_TESTS=OFF `
            -DBUILD_JAVA_INTERFACE=OFF `
            -DBUILD_PYTHON_INTERFACE=OFF `
            -DUSE_VCPKG=1 `
            -DCUSTOM_CMAKE="./platform/windows/Custom-vs.cmake"
          cmake --build build --config Release
          cmake --install build --prefix build\install --config Release

      - name: Import macOS signing certificate
        if: matrix.os_name == 'macos'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}


      - name: Decode App Store Connect API key
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Configure - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist/csound-ac" \
            -DGENERATE_DOCUMENTATION=OFF \
            -DCMAKE_PREFIX_PATH="/usr/local;/usr;/Library/Frameworks" \
            -DPython3_EXECUTABLE="$(brew --prefix python@3.12)/bin/python3.12" \
            -DCSOUND_AC_ENABLE_CODESIGN=ON \
            -DCSOUND_AC_ENABLE_NOTARIZATION=ON \
            -DAPPLE_CODESIGN_IDENTITY="${{ secrets.APPLE_CODESIGN_IDENTITY }}" \
            -DAPPLE_NOTARY_KEY="$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
            -DAPPLE_NOTARY_KEY_ID="${{ secrets.APPLE_API_KEY_ID }}" \
            -DAPPLE_NOTARY_ISSUER_ID="${{ secrets.APPLE_API_ISSUER_ID }}"

      - name: Configure - Linux
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
           cmake -S . -B "${{ matrix.build_dir }}" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist/csound-ac" \
            -DGENERATE_DOCUMENTATION=OFF \
            -DPython3_EXECUTABLE="$(which python3)"

      - name: Configure - Windows
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist/csound-ac" `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}\csound\build\install" `
            -DCSOUND_ROOT_HINT="${{ github.workspace }}\csound\build\install"

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --config Release --verbose

      - name: Stage dist
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target stage_dist --config Release --verbose

      - name: Sign dist - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target sign_dist --config Release --verbose

      - name: Package dist
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target package_dist --config Release --verbose

      - name: Notarize dist - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target notarize_dist --config Release --verbose

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.build_dir }}/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip