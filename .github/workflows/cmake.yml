name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os_name: macos
            runner: macos-latest
            build_dir: build-macos
            archive_name: csound-ac-macos.zip

          - name: Linux
            os_name: linux
            runner: ubuntu-latest
            build_dir: build-linux
            archive_name: csound-ac-linux.zip

          - name: Windows
            os_name: windows
            runner: windows-latest
            build_dir: build-windows
            archive_name: csound-ac-windows.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies - macOS
        if: matrix.os_name == 'macos'
        run: |
          brew update
          brew install cmake ninja swig boost eigen libsndfile

      - name: Install dependencies - Linux
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            swig \
            python3-dev \
            libboost-all-dev \
            libeigen3-dev \
            libsndfile1-dev \
            zip

      - name: Install dependencies - Windows
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          choco install cmake ninja swig -y

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --config Release

      - name: Stage dist
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target stage_dist --config Release

      - name: Sign dist - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
        run: |
          cmake --build "${{ matrix.build_dir }}" --target sign_dist --config Release

      - name: Package dist
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --target package_dist --config Release

      - name: Notarize dist - macOS
        if: matrix.os_name == 'macos'
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          cmake --build "${{ matrix.build_dir }}" --target notarize_dist --config Release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: dist/*.zip

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*.zip